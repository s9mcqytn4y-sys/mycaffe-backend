name: CI - Quality Gates & Security Checks

on:
  push:
    branches: [ main, staging, "feature/**" ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Go Lint, Vet, Security, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Secret Scan (Gitleaks with Checksum Verification)
        run: |
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          sha256sum --ignore-missing --check gitleaks_8.24.3_checksums.txt
          sudo tar -xz -C /usr/local/bin -f gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          rm -f gitleaks_8.24.3_*
          gitleaks git --verbose

      - name: Check code formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            exit 1
          fi

      - name: Check Go Module Tidy
        run: go mod tidy -diff

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Vulnerability Check (Govulncheck Pinned v1.9.0)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m ./...

      - name: Compile Application & Migration CLI (Go Build)
        run: go build -v ./...

  docker-build:
    name: Docker, Compose, Nginx TLS & Backup Script Verification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Production Docker Image (API + Migrator)
        run: |
          docker build -t mycaffe-api:ci -f deploy/docker/Dockerfile .

      - name: Validate Docker Compose Configurations (Dev & Production)
        run: |
          docker compose -f deploy/docker/docker-compose.yml config >/dev/null
          docker compose --env-file .env.example -f deploy/docker/docker-compose.prod.yml config >/dev/null

      - name: Validate Nginx Configurations (Dev HTTP & Production HTTPS TLS)
        run: |
          docker run --rm --add-host=api:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

          docker run --rm --add-host=api:127.0.0.1 --add-host=web:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine sh -c "apk add --no-cache openssl >/dev/null && mkdir -p /etc/letsencrypt/live/mycaffe && openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout /etc/letsencrypt/live/mycaffe/privkey.pem -out /etc/letsencrypt/live/mycaffe/fullchain.pem -subj '/CN=localhost' 2>/dev/null && nginx -t"

      - name: Validate Offsite Backup Script Syntax
        run: |
          bash -n scripts/backup/backup_to_r2.sh

  database-migration-test:
    name: PostgreSQL 18 Migrator CLI, RLS, Constraints, Rollback & Seed
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mycaffe_migrator
          POSTGRES_PASSWORD: mycaffe_password
          POSTGRES_DB: mycaffe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply Initial Schema Migration via Go Migrator CLI (PostgreSQL 18)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_password@localhost:5432/mycaffe_test?sslmode=disable
        run: |
          go run ./cmd/migrate -action=up

      - name: Verify Schema Constraints, RLS Isolation, Triggers & Atomic Sequences
        env:
          PGPASSWORD: mycaffe_password
        run: |
          psql -h localhost -p 5432 -U mycaffe_migrator -d mycaffe_test -v ON_ERROR_STOP=1 -f scripts/verify/verify_schema_constraints.sql

      - name: Test Migration Rollback via Go Migrator CLI
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_password@localhost:5432/mycaffe_test?sslmode=disable
        run: |
          go run ./cmd/migrate -action=down

      - name: Re-apply Migration & Verify Idempotent Up
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_password@localhost:5432/mycaffe_test?sslmode=disable
        run: |
          go run ./cmd/migrate -action=up
          go run ./cmd/migrate -action=up

      - name: Test Idempotent Seed Execution via Go Migrator CLI (Run Twice)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_password@localhost:5432/mycaffe_test?sslmode=disable
          PGPASSWORD: mycaffe_password
        run: |
          echo "Executing Seed (Run 1)..."
          go run ./cmd/migrate -action=seed

          echo "Executing Seed (Run 2 - Idempotency Verification)..."
          go run ./cmd/migrate -action=seed

          echo "Verifying row stability after double seed..."
          STORE_COUNT=$(psql -h localhost -p 5432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM stores;")
          ORDER_COUNT=$(psql -h localhost -p 5432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM orders;")
          MOD_GROUP_COUNT=$(psql -h localhost -p 5432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM modifier_groups;")
          SPLIT_COUNT=$(psql -h localhost -p 5432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM payment_splits;")
          if [ "$STORE_COUNT" != "2" ] || [ "$ORDER_COUNT" != "1" ] || [ "$MOD_GROUP_COUNT" != "3" ] || [ "$SPLIT_COUNT" != "1" ]; then
            echo "Seed idempotency failed! Stores=$STORE_COUNT, Orders=$ORDER_COUNT, ModGroups=$MOD_GROUP_COUNT, Splits=$SPLIT_COUNT"
            exit 1
          fi
          echo "Idempotent Seed verified successfully (Stores: $STORE_COUNT, Orders: $ORDER_COUNT, ModGroups: $MOD_GROUP_COUNT, Splits: $SPLIT_COUNT)."
