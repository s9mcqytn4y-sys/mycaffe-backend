name: CI - Quality Gates & Security Checks

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Go Lint, Vet, Security, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Secret Scan (Gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git --verbose

      - name: Check code formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            exit 1
          fi

      - name: Check Go Module Tidy
        run: go mod tidy -diff

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Vulnerability Check (Govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m ./...

      - name: Compile Application (Go Build)
        run: go build -v ./...
