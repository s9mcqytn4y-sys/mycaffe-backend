name: CI - Quality Gates & Security Checks

on:
  push:
    branches: [ main, staging, "feature/**", "feat/**", "fix/**", "chore/**" ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Go Lint, Vet, Security, Test, and Build
    runs-on: [self-hosted, linux, mycaffe]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Secret Scan (Gitleaks with Checksum Verification)
        run: |
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          sha256sum --ignore-missing --check gitleaks_8.24.3_checksums.txt
          sudo tar -xz -C /usr/local/bin -f gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          rm -f gitleaks_8.24.3_*
          gitleaks git --verbose

      - name: Check code formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            while IFS= read -r file; do
              echo "gofmt diff for $file:"
              gofmt -d "$file" || true
            done <<< "$diffs"
            exit 1
          fi

      - name: Check Go Module Tidy
        run: go mod tidy -diff

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Vulnerability Check (Govulncheck Pinned v1.9.0)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m ./...

      - name: Compile Application & Migration CLI (Go Build)
        run: go build -v ./...

  docker-build:
    name: Docker, Compose, Nginx TLS Bootstrap & Backup/Restore Script Verification
    runs-on: [self-hosted, linux, mycaffe]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Production Docker Image (API + Migrator)
        run: |
          docker build -t mycaffe-api:ci -f deploy/docker/Dockerfile .

      # P0-06: fail on CRITICAL OS/Go-module CVEs that have a fix; HIGH is reported only.
      # Pinned binary with a hard-coded checksum instead of trivy-action (compromised in March 2026).
      - name: Scan Image for Vulnerabilities (Trivy v0.76.0, checksum-pinned)
        run: |
          curl -sSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  trivy.tgz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin -f trivy.tgz trivy
          rm -f trivy.tgz
          trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH --exit-code 0 mycaffe-api:ci
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 mycaffe-api:ci

      - name: Validate Docker Compose Configurations (Dev & Production)
        run: |
          docker compose -f deploy/docker/docker-compose.yml config >/dev/null
          docker compose --env-file .env.example -f deploy/docker/docker-compose.prod.yml config >/dev/null

      - name: Validate Nginx Configurations
        run: |
          docker run --rm --add-host=api:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

          docker run --rm --add-host=api:127.0.0.1 --add-host=web:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate Operational Shell Scripts Syntax
        run: |
          bash -n scripts/backup/backup_to_r2.sh
          bash -n scripts/backup/restore_from_r2.sh
          bash -n scripts/backup/restore_drill.sh
          bash -n scripts/deploy/deploy.sh
          bash -n scripts/deploy/compose.sh
          bash -n scripts/deploy/test_deploy_rollback.sh
          sh -n deploy/postgres/00-init-roles.sh

      - name: Deploy by Digest with Automatic Rollback (local registry)
        run: ./scripts/deploy/test_deploy_rollback.sh

      - name: Validate Alloy Config and Unit-Test Alert Rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" grafana/alloy:v1.21.2 fmt /m/config.alloy >/dev/null
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool prom/prometheus:v3.13.5 check rules alert-rules.yml
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool prom/prometheus:v3.13.5 test rules alert-rules.test.yml

  database-migration-test:
    name: PostgreSQL 18 Triple-Role, Migrator CLI, RLS, Direct mycaffe_app Login & Seed
    runs-on: [self-hosted, linux, mycaffe]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mycaffe_super_password
          POSTGRES_DB: mycaffe_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Bootstrap Non-Superuser Roles (mycaffe_migrator & mycaffe_app)
        env:
          PGHOST: localhost
          PGPORT: "55432"
          PGPASSWORD: mycaffe_super_password
          POSTGRES_USER: postgres
          POSTGRES_DB: mycaffe_test
          DB_MIGRATOR_USER: mycaffe_migrator
          DB_MIGRATOR_PASSWORD: mycaffe_migrator_password
          DB_APP_USER: mycaffe_app
          DB_APP_PASSWORD: mycaffe_app_password
        run: |
          sh deploy/postgres/00-init-roles.sh

      - name: Apply Initial Schema Migration via Go Migrator CLI (as Non-Superuser mycaffe_migrator)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_migrator_password@localhost:55432/mycaffe_test?sslmode=disable
          DB_APP_USER: mycaffe_app
          DB_APP_PASSWORD: mycaffe_app_password
        run: |
          go run ./cmd/migrate -action=up

      - name: Verify Schema Constraints, RLS Isolation, Triggers & No-DELETE Ledgers
        env:
          PGPASSWORD: mycaffe_migrator_password
        run: |
          psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -v ON_ERROR_STOP=1 -f scripts/verify/verify_schema_constraints.sql

      - name: Test Migration Rollback via Go Migrator CLI
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_migrator_password@localhost:55432/mycaffe_test?sslmode=disable
        run: |
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down
          go run ./cmd/migrate -action=down

      - name: Re-apply Migration & Verify Idempotent Up
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_migrator_password@localhost:55432/mycaffe_test?sslmode=disable
          DB_APP_USER: mycaffe_app
          DB_APP_PASSWORD: mycaffe_app_password
        run: |
          go run ./cmd/migrate -action=up
          go run ./cmd/migrate -action=up

      - name: Test Idempotent Seed Execution via Go Migrator CLI (Run Twice)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://mycaffe_migrator:mycaffe_migrator_password@localhost:55432/mycaffe_test?sslmode=disable
          PGPASSWORD: mycaffe_migrator_password
        run: |
          echo "Executing Seed (Run 1)..."
          go run ./cmd/migrate -action=seed

          echo "Capturing row counts after first seed..."
          STORE_COUNT_BEFORE=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM stores;")
          ORDER_COUNT_BEFORE=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM orders;")
          MOD_GROUP_COUNT_BEFORE=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM modifier_groups;")
          SPLIT_COUNT_BEFORE=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM payment_splits;")

          echo "Executing Seed (Run 2 - Idempotency Verification)..."
          go run ./cmd/migrate -action=seed

          echo "Verifying row stability after second seed..."
          STORE_COUNT_AFTER=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM stores;")
          ORDER_COUNT_AFTER=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM orders;")
          MOD_GROUP_COUNT_AFTER=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM modifier_groups;")
          SPLIT_COUNT_AFTER=$(psql -h localhost -p 55432 -U mycaffe_migrator -d mycaffe_test -t -A -c "SELECT COUNT(*) FROM payment_splits;")
          if [ "$STORE_COUNT_BEFORE" != "$STORE_COUNT_AFTER" ] || [ "$ORDER_COUNT_BEFORE" != "$ORDER_COUNT_AFTER" ] || [ "$MOD_GROUP_COUNT_BEFORE" != "$MOD_GROUP_COUNT_AFTER" ] || [ "$SPLIT_COUNT_BEFORE" != "$SPLIT_COUNT_AFTER" ]; then
            echo "Seed idempotency failed!"
            echo "Before: Stores=$STORE_COUNT_BEFORE, Orders=$ORDER_COUNT_BEFORE, ModGroups=$MOD_GROUP_COUNT_BEFORE, Splits=$SPLIT_COUNT_BEFORE"
            echo "After:  Stores=$STORE_COUNT_AFTER, Orders=$ORDER_COUNT_AFTER, ModGroups=$MOD_GROUP_COUNT_AFTER, Splits=$SPLIT_COUNT_AFTER"
            exit 1
          fi
          echo "Idempotent Seed verified successfully; all row counts remained stable after the second execution."

      - name: Verify Direct TCP Login, RLS & Transactional Order/Payment/Auth Services Connected as mycaffe_app
        env:
          TEST_APP_DATABASE_URL: postgres://mycaffe_app:mycaffe_app_password@localhost:55432/mycaffe_test?sslmode=disable
          TEST_MIGRATOR_DATABASE_URL: postgres://mycaffe_migrator:mycaffe_migrator_password@localhost:55432/mycaffe_test?sslmode=disable
        run: |
          # Same command as ./scripts/dev.ps1 test-int: every package, so a new integration test cannot be left out.
          set -o pipefail
          go test -v -race -count=1 -timeout 10m ./... | tee go-test.log
          # With a database available, a skipped DB test means its env wiring broke: fail instead of passing silently.
          if grep -E -- '--- SKIP: Test[A-Za-z0-9_]*(Integration|RLS)' go-test.log; then
            echo "Integration tests were skipped although TEST_APP_DATABASE_URL is set." >&2
            exit 1
          fi
          echo "Integration tests run: $(grep -cE -- '^--- PASS: Test[A-Za-z0-9_]*(Integration|RLS)' go-test.log)"

      - name: Backup to S3 (R2 stand-in) and Restore Drill Round-Trip
        env:
          R2_ENDPOINT: http://127.0.0.1:9090
          R2_BACKUP_BUCKET: mycaffe-backups
          R2_BACKUP_PREFIX: backups
          AWS_ACCESS_KEY_ID: ci-not-a-secret
          AWS_SECRET_ACCESS_KEY: ci-not-a-secret
          AWS_DEFAULT_REGION: us-east-1
          BACKUP_ENCRYPTION_PASSPHRASE: ci-only-throwaway-passphrase
          METRICS_TEXTFILE_DIR: ${{ runner.temp }}/textfile
        run: |
          set -euo pipefail
          mkdir -p "$METRICS_TEXTFILE_DIR"
          docker run -d --name s3mock -p 127.0.0.1:9090:9090 adobe/s3mock:4.7.0
          aws configure set default.s3.addressing_style path
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9090/ >/dev/null && break; sleep 1; done
          aws --endpoint-url "$R2_ENDPOINT" s3 mb "s3://$R2_BACKUP_BUCKET"
          PG="$(docker ps -q --filter ancestor=postgres:18-alpine | head -n 1)"

          # Two backups of the integration-test database: both land in hourly/, only the first is promoted.
          DB_CONTAINER="$PG" DB_NAME=mycaffe_test ./scripts/backup/backup_to_r2.sh
          sleep 2
          DB_CONTAINER="$PG" DB_NAME=mycaffe_test ./scripts/backup/backup_to_r2.sh
          count() { aws --endpoint-url "$R2_ENDPOINT" s3 ls "s3://$R2_BACKUP_BUCKET/backups/$1/" | grep -c '\.dump\.gpg$' || true; }
          test "$(count hourly)" = 2 && test "$(count daily)" = 1 && test "$(count monthly)" = 1

          # Drill: restore the newest backup into a throwaway PG18, prove mycaffe_app can read it, compare with the source.
          SOURCE_CONTAINER="$PG" SOURCE_DB=mycaffe_test ./scripts/backup/restore_drill.sh | tee drill.log
          grep -q '^RESULT PASS' drill.log

          # Both scripts leave textfile metrics for the backup/drill freshness alerts.
          grep -E '^mycaffe_backup_last_success_timestamp_seconds [0-9]+$' "$METRICS_TEXTFILE_DIR/backup.prom"
          grep -E '^mycaffe_restore_drill_last_success_timestamp_seconds [0-9]+$' "$METRICS_TEXTFILE_DIR/restore_drill.prom"

          # Restoring over a non-disposable database without explicit confirmation must be refused.
          if DB_CONTAINER="$PG" DB_NAME=mycaffe_prod DB_MIGRATOR_USER=mycaffe_migrator BACKUP_OBJECT=latest \
               ./scripts/backup/restore_from_r2.sh; then
            echo "Restore guard did not block a production-named database." >&2
            exit 1
          fi
