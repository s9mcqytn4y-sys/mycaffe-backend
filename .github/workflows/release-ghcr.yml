name: Release - Publish Immutable Container Image to GHCR

on:
  push:
    branches: [ main, staging ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-ghcr:
    name: Build & Push ghcr.io/s9mcqytn4y-sys/mycaffe-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mycaffe-api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image to GHCR
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.15.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Production deploys pin this digest (scripts/deploy/deploy.sh); tags are only for humans.
      - name: Publish image digest to the run summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ghcr.io/${{ github.repository_owner }}/mycaffe-api"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Deploy: \`scripts/deploy/deploy.sh ${DIGEST}\`"
            echo
            echo "Tags:"
            echo "${TAGS}" | sed 's/^/- /'
          } >> "${GITHUB_STEP_SUMMARY}"
