# MyCaffe POS Platform — Production Docker Compose
# Architecture: Single-VPS Modular Monolith (Hostinger KVM 2: 2 vCPU, 8 GB RAM, 100 GB NVMe)
# Target OS: Ubuntu 24.04 LTS
# Pulls immutable GHCR images built in CI (no source code compilation on VPS).

services:
  postgres:
    image: postgres:18-alpine
    container_name: mycaffe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER must be set}
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD must be set}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_messages=warning
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - mycaffe-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATOR_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 3500M
        reservations:
          cpus: '0.5'
          memory: 1024M

  migrate:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-api:${API_IMAGE_TAG:?API_IMAGE_TAG must be pinned}
    container_name: mycaffe-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "production"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_EXPIRED_HOURS: ${JWT_EXPIRED_HOURS:-24}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:?MIDTRANS_MERCHANT_ID must be set}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY must be set}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY must be set}
      MIDTRANS_IS_PRODUCTION: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
    entrypoint: ["/app/mycaffe-migrate", "-action=up", "-dir=/app/db/migrations"]
    networks:
      - mycaffe-internal

  api:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-api:${API_IMAGE_TAG:?API_IMAGE_TAG must be pinned}
    container_name: mycaffe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      APP_ENV: "production"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_EXPIRED_HOURS: ${JWT_EXPIRED_HOURS:-24}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:?MIDTRANS_MERCHANT_ID must be set}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY must be set}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY must be set}
      MIDTRANS_IS_PRODUCTION: "true"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-mycaffe-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: "production"
    networks:
      - mycaffe-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 128M

  web:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-web:${WEB_IMAGE_TAG:?WEB_IMAGE_TAG must be pinned}
    container_name: mycaffe-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    networks:
      - mycaffe-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: mycaffe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - web-root:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - mycaffe-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  certbot:
    image: certbot/certbot:latest
    container_name: mycaffe-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
    driver: local
  certbot-etc:
  certbot-var:
  web-root:

networks:
  mycaffe-internal:
    driver: bridge
