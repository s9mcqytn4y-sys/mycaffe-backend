# MyCaffe POS Platform - Production Docker Compose
# Architecture: Single-VPS Modular Monolith (Hostinger KVM 2: 2 vCPU, 8 GB RAM, 100 GB NVMe)
# Target OS: Ubuntu 24.04 LTS
# Pulls GHCR images by digest (immutable) via scripts/deploy/deploy.sh; no source compilation on the VPS.

services:
  postgres:
    image: postgres:18-alpine
    container_name: mycaffe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?DB_SUPERUSER_PASSWORD must be set}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER must be set}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD must be set}
      DB_APP_USER: ${DB_APP_USER:-mycaffe_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_messages=warning
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/00-init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
    networks:
      - mycaffe-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATOR_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 3500M
        reservations:
          cpus: '0.5'
          memory: 1024M

  migrate:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-api@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be set (use scripts/deploy/deploy.sh)}
    container_name: mycaffe-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "production"
      DATABASE_MIGRATION_URL: ${COMPOSE_DATABASE_MIGRATION_URL:?COMPOSE_DATABASE_MIGRATION_URL must be set}
      DB_APP_USER: ${DB_APP_USER:-mycaffe_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
    entrypoint: ["/app/mycaffe-migrate", "-action=up", "-dir=/app/db/migrations"]
    networks:
      - mycaffe-data

  api:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-api@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST must be set (use scripts/deploy/deploy.sh)}
    container_name: mycaffe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      APP_ENV: "production"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      # Only the edge network (Nginx) may set X-Forwarded-For; keeps ClientIP() unspoofable.
      TRUSTED_PROXIES: ${EDGE_SUBNET:-172.30.0.0/24}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?COMPOSE_DATABASE_URL must be set}
      DB_APP_USER: ${DB_APP_USER:-mycaffe_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_EXPIRED_HOURS: ${JWT_EXPIRED_HOURS:-24}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:?MIDTRANS_MERCHANT_ID must be set}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY must be set}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY must be set}
      MIDTRANS_IS_PRODUCTION: "true"
      # Hostinger mailbox (smtp.hostinger.com:465, implicit TLS). The API refuses to start without it.
      EMAIL_DRIVER: smtp
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS must be set}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MyCaffe}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
      # Slug created by cmd/migrate -action=bootstrap-store; empty for multi-branch.
      DEFAULT_STORE_SLUG: ${DEFAULT_STORE_SLUG:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-mycaffe-media}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-mycaffe-private-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: "production"
      # Scraped by alloy over mycaffe-metrics; no host port and no Nginx route.
      METRICS_ADDR: ":9091"
    networks:
      - mycaffe-edge
      - mycaffe-data
      - mycaffe-metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 128M

  web:
    image: ghcr.io/s9mcqytn4y-sys/mycaffe-web@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST must be set (use scripts/deploy/deploy.sh)}
    container_name: mycaffe-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    networks:
      - mycaffe-edge
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: mycaffe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/entrypoint-tls-bootstrap.sh:/etc/nginx/entrypoint-tls-bootstrap.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt:ro
      - web-root:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint-tls-bootstrap.sh"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - mycaffe-edge
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  certbot:
    image: certbot/certbot:latest
    container_name: mycaffe-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/certbot
    networks:
      - mycaffe-edge
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  # Metrics shipper (decision IN3, docs/Setup/Monitoring.md): API + host metrics to Grafana Cloud.
  # Host paths are read-only; no docker.sock.
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: mycaffe-alloy
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      MYCAFFE_CLIENT: ${MYCAFFE_CLIENT:?MYCAFFE_CLIENT must be set}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:?GRAFANA_CLOUD_PROM_URL must be set}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:?GRAFANA_CLOUD_PROM_USER must be set}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:?GRAFANA_CLOUD_API_KEY must be set}
    volumes:
      - ../monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/lib/mycaffe/metrics:/host/textfile:ro
    networks:
      - mycaffe-metrics
      - mycaffe-monitor-egress
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  pgdata:
    driver: local
  alloy-data:
  certbot-etc:
  certbot-var:
  web-root:

networks:
  mycaffe-edge:
    driver: bridge
    # Fixed subnet so the API can trust exactly this proxy hop (TRUSTED_PROXIES).
    # Changing it on an existing host requires `docker compose down` to recreate the network.
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  mycaffe-data:
    driver: bridge
    internal: true
  # api <-> alloy only, so the scrape never crosses the edge or data networks.
  mycaffe-metrics:
    driver: bridge
    internal: true
  # alloy's outbound HTTPS to Grafana Cloud.
  mycaffe-monitor-egress:
    driver: bridge
