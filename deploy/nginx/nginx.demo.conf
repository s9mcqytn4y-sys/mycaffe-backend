user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Demo / staging reverse proxy behind a Cloudflare Tunnel (deploy/docker/docker-compose.demo.yml).
# One origin serves both the POS frontend and the API (owner decision I3), so the
# SameSite=Strict refresh cookie works without a domain:
#   /api/, /ws, /health  -> Go API (container "api")
#   everything else      -> Next.js dev server on the Windows host (host.docker.internal:3000)

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # cloudflared is the only peer and sets X-Forwarded-For to the visitor IP. Trust it only
    # from the fixed demo edge subnet so rate limits key on real visitors, not on cloudflared.
    set_real_ip_from 172.29.10.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/m;
    # Public guest routes (QR resolve, menu, quote; decision QR5): 30 req/min per IP.
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=30r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        server api:8080;
        keepalive 16;
    }

    upstream web_frontend {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Served-By "AzureDevID Edge Gateway" always;
        add_header X-Product-Name "Cassy POS Engine" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /api/v1/payments/midtrans/webhook {
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # Only the PIN-checking endpoint gets the strict limit; a cafe NATs all tablets behind one IP.
        location /api/v1/public/ {
            limit_req zone=public_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location ~ ^/api/v1/auth/staff/(login|pin/forgot|pin/forgot-sms|pin/reset-sms|pin/setup)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Frontend (and Next.js dev HMR websocket). Shows a clear page when it is not running.
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_intercept_errors on;
            error_page 502 504 = @frontend_down;
        }

        location @frontend_down {
            default_type text/html;
            return 503 '<!doctype html><meta charset="utf-8"><title>MyCaffe Demo</title><p>Frontend POS belum berjalan di laptop (npm run dev di port 3000). API tetap aktif di <a href="/health/live">/health/live</a>.</p>';
        }
    }
}
