user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Only cloudflared reaches Nginx (IN1, no published ports). Cloudflare puts the visitor IP in
    # CF-Connecting-IP, so rate limits and logs are per visitor, not per tunnel. Keep in sync with EDGE_SUBNET.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:5m rate=10r/s;
    # Staff login brute-force guard (ADR-003 D3, outermost layer).
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/m;
    # Public guest routes (decision QR5). One cafe's guests share a Wi-Fi IP, so the budget is per venue.
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=180r/m;
    limit_req_status 429;

    # Maintenance (N3): `scripts/deploy/maintenance.sh on` creates maintenance/maintenance.on, checked on
    # every request, so no reload is needed. Payment webhooks and health probes always pass through.
    map $uri $maintenance_exempt {
        # volatile: re-evaluate after error_page's internal redirect instead of reusing the first value.
        volatile;
        default 0;
        /api/v1/payments/midtrans/webhook 1;
        ~^/api/v1/payments/midtrans/webhook/ 1;
        ~^/health 1;
        /nginx-health 1;
        # error_page redirects internally and re-runs the server-level check; the page itself must pass.
        ~^/_maintenance\. 1;
    }
    # API and WebSocket clients (POS, KDS) get JSON; browsers get the static page.
    map $uri $maintenance_page {
        default /_maintenance.html;
        ~^/(api|ws)(/|$) /_maintenance.json;
    }
    map $status $retry_after {
        503 120;
        default "";
    }
    map $status $maintenance_cache {
        503 "no-store";
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        zone api_backend 64k;
        server api:8080 resolve; # re-resolve after a deploy recreates api (no stale IP, no 502)
        keepalive 32;
    }

    # The web container is optional (W3): resolve it per request through Docker DNS so Nginx starts
    # without it, and answer a short status page while it is absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # TLS ends at the Cloudflare edge; the tunnel delivers plain HTTP on the internal edge network (IN1).
    server {
        listen 80;
        server_name _;

        location @web_absent {
            default_type application/json;
            return 503 '{"status":"service_unavailable","service":"Cassy API by AzureDevID","contact":"support@azuredev.id","api":"/api/v1/health"}';
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        set $maintenance "";
        if (-f /etc/nginx/maintenance/maintenance.on) {
            set $maintenance "on";
        }
        if ($maintenance_exempt) {
            set $maintenance "";
        }
        if ($maintenance = "on") {
            return 503;
        }
        error_page 503 $maintenance_page;
        location ^~ /_maintenance. {
            internal;
            root /etc/nginx/maintenance;
        }

        # Empty unless the response is 503; nginx skips a header whose value is empty.
        add_header Retry-After $retry_after always;
        add_header Cache-Control $maintenance_cache always;
        add_header X-Served-By "AzureDevID Edge Gateway" always;
        add_header X-Product-Name "Cassy POS Engine" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Next.js injects inline bootstrap scripts; tightening script-src needs per-request nonces.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Midtrans Payment Webhook (no redirect: Midtrans does not follow 3xx)
        location = /api/v1/payments/midtrans/webhook {
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Backend REST API
        # Only the PIN-checking endpoint gets the strict limit; a cafe NATs all tablets behind one IP.
        location /api/v1/public/ {
            limit_req zone=public_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location ~ ^/api/v1/auth/staff/(login|pin/forgot|pin/forgot-sms|pin/reset-sms|pin/setup)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Health & Readiness Probes
        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Realtime WebSocket (KDS, POS, TV Queue)
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Next.js Frontend Application
        location / {
            set $web_frontend http://web:3000;
            proxy_pass $web_frontend;
            proxy_intercept_errors on;
            error_page 502 503 504 = @web_absent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}

