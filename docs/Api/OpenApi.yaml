                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/pin/setup:
    post:
      tags: [Auth]
      operationId: staffSetupPin
      summary: Set a PIN from an activation or reset link
      x-implementation-status: implemented
      description: |
        `token` is the value after `#token=` in the emailed link (`<store_id>.<token_id>.<secret>`). The URL
        fragment is never sent to servers, so the secret stays out of access logs. Single use. On success
        all existing sessions of the user are revoked; after a reset a security notice email is queued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, pin]
              properties:
                token:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "200":
          description: PIN set; the client can prefill the login form
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  store_slug:
                    type: string
                  email:
                    type: string
                    format: email
        "400":
          description: "`PIN_REJECTED` (format or weak PIN) or `LINK_INVALID` (unknown, used, or expired link)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/pin/change:
    post:
      tags: [Auth]
      operationId: staffChangePin
      summary: Change own PIN (required after a temporary PIN)
      x-implementation-status: implemented
      description: A wrong `current_pin` counts toward the lockout. Other sessions are revoked; the current one stays signed in.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin:
                  type: string
                  writeOnly: true
                new_pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "204":
          description: PIN changed
        "400":
          description: "`PIN_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong current PIN (`INVALID_CREDENTIALS`) or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: List staff of the caller's store (owner)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffSummary"
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Staff]
      operationId: inviteStaff
      summary: Invite a staff member (owner)
      x-implementation-status: implemented
      description: Creates the account without a PIN and queues an activation email (link valid 48 hours). The store comes from the owner's token, never from the body.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role]
              properties:
                full_name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Stored trimmed and lower-case; unique per store regardless of case.
                role:
                  $ref: "#/components/schemas/StaffRole"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSummary"
        "400":
          description: Invalid name, email, or role (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already used in this store (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff/{id}/pin-reset:
    post:
      tags: [Staff]
      operationId: sendStaffPinReset
      summary: Email a PIN-reset link to a staff member (owner)
      x-implementation-status: implemented
      description: For a staff member who never activated, the invitation is re-sent instead.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Link queued
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown or inactive staff (`STAFF_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff/{id}/phone:
    post:
      tags: [Staff]
      operationId: setStaffPhone
      summary: Record the staff phone that receives PIN reset codes (owner; audited STAFF_PHONE_SET)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: Normalised E.164 phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  phone: {type: string, example: "+6281234567890"}
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: STAFF_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CONFLICT (phone used by another staff member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION_FAILED (phone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/staff/{id}/temporary-pin:
    post:
      tags: [Staff]
      operationId: issueStaffTemporaryPin
      summary: Set a temporary PIN for staff without email (owner)
      x-implementation-status: implemented
      description: The staff member must change it after login (`pin_change_required=true`). Not allowed on the owner's own account. Revokes all sessions of that staff member.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "204":
          description: Temporary PIN set
        "400":
          description: "`PIN_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner, or the owner's own account (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown staff (`STAFF_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerStaffJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Staff access token (HS256 JWT, 15-minute TTL per ADR-003 D4). Claims: `iss=mycaffe-backend`, `aud=mycaffe-pos`,
        `typ=staff_access`, `sub` (user id), `store_id`, `role` (`owner`, `cashier`, `barista`, `kitchen`), `sid` (session id),
        `jti`, `iat`, `exp`; header `kid`. Not stateless: every request is revalidated against the server-side session and
        current user role. Never sent in a query string.
    StaffRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-mc_staff_rt
      description: Opaque rotating refresh token (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth/staff). Planned, ADR-003 D4.
    TableQRToken:
      type: apiKey
      in: header
      name: X-Table-QR-Token
      description: Signed HMAC token binding a public dine-in/takeaway session to a specific `store_id` and `table_number`.

  parameters:
    ReportFrom:
      name: from
      in: query
      description: First business day (YYYY-MM-DD, store time zone); defaults to today.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last business day, inclusive; defaults to from. At most 92 days after from.
      schema:
        type: string
        format: date
    ReportFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [json, csv]
        default: json
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag from a previous response; the server answers 304 when unchanged.
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CsrfProtectionHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      description: Must be `1`. Forces a CORS preflight so cross-site forms cannot use the refresh cookie.
      schema:
        type: string
        enum: ["1"]

  responses:
    InvalidJSON:
      description: Malformed JSON body (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing permission (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found in the caller's store (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Uniqueness clash (`CONFLICT`) on `field`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictResponse"
    ValidationFailed:
      description: Field-level validation errors (`VALIDATION_FAILED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    KDSTicket:
      type: object
      required: [id, order_id, order_number, queue_number, table_number, station, status, late_payment, created_at, lines]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        round_number:
          type: integer
        order_number:
          type: string
        queue_number:
          type: string
        table_number:
          type: string
        station:
          type: string
          enum: [bar, kitchen]
        status:
          type: string
          enum: [queued, preparing, ready, served, cancelled]
        late_payment:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        served_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, options]
            properties:
              name:
                type: string
              variant:
                type: string
              quantity:
                type: integer
              options:
                type: string
                description: JSON snapshot of the selected modifiers
              notes:
                type: string
    WSTicket:
      type: object
      required: [ticket, expires_at, channels]
      properties:
        ticket:
          type: string
          description: "<store_id>.<ticket_id>.<secret>; pass as GET /ws?ticket= within 30 seconds"
        expires_at:
          type: string
          format: date-time
        channels:
          type: array
          items:
            type: string
            description: pos, kds.bar, kds.kitchen or guest.<guest_session_id>
    GuestSession:
      type: object
      required: [table_number, expires_at]
      properties:
        table_number:
          type: string
        expires_at:
          type: string
          format: date-time
    GuestOrderRequest:
      type: object
      required: [idempotency_key, items]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 50
        customer_name:
          type: string
          maxLength: 60
          description: Defaults to "Tamu Meja <table number>"
        notes:
          type: string
          maxLength: 140
        expected_total:
          type: integer
          format: int64
        expected_quote_fingerprint:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OrderItemInput"
    GuestOrderResponse:
      type: object
      required: [order, is_idempotent_replay]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        tracking_token:
          type: string
          description: Shown once; only its SHA-256 is stored
        is_idempotent_replay:
          type: boolean
    GuestOrderSummary:
      type: object
      required: [id, order_number, queue_number, status, payment_status, total_amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        queue_number:
          type: string
        status:
          type: string
        payment_status:
          type: string
        total_amount:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TrackedOrder:
      type: object
      required: [store_name, order_number, queue_number, status, payment_status, updated_at]
      properties:
        store_name:
          type: string
        order_number:
          type: string
        queue_number:
          type: string
        status:
          type: string
        payment_status:
          type: string
        updated_at:
          type: string
          format: date-time
    TableInput:
      type: object
      properties:
        table_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required on create; unique per store among non-archived tables (case-insensitive)
        label:
          type: string
          maxLength: 100
        section:
          type: string
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          default: 4
        is_active:
          type: boolean
    Table:
      type: object
      required: [id, table_number, label, section, capacity, qr_rotated_at, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        table_number:
          type: string
        label:
          type: string
        section:
          type: string
        capacity:
          type: integer
        qr_token:
          type: string
          description: Opaque 256-bit base64url token printed as QR (decision QR1); omitted for staff without table.qr.manage
        qr_rotated_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TableSession:
      type: object
      required: [id, table_id, status, opened_at, opened_via]
      properties:
        id:
          type: string
          format: uuid
        table_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        opened_at:
          type: string
          format: date-time
        opened_via:
          type: string
          enum: [qr, staff]
        opened_by_user_id:
          type: string
          format: uuid
        settled_at:
          type: string
          format: date-time
