                type: boolean
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              category_id:
                type: ["string", "null"]
                format: uuid
              name:
                type: string
              description:
                type: string
              type:
                type: string
                enum: [prepared, ready_to_serve]
              prep_station:
                type: string
                enum: [bar, kitchen, none]
              image_url:
                type: ["string", "null"]
              available:
                type: boolean
              sold_out_reason:
                type: ["string", "null"]
              stock_quantity:
                type: integer
