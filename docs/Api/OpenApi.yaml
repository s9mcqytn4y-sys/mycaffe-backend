        name:
          type: string
          maxLength: 60
          description: Required on create.
        sku:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]*$"
          description: Optional; stored upper case; unique per store among active variants.
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: Integer Rupiah. Required on create.
        is_default:
          type: boolean
        is_available:
          type: boolean
        display_order:
          type: integer
          minimum: 0
          maximum: 10000
    ProductInput:
      type: object
