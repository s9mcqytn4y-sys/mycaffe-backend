        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        splits:
          type: array
          items:
            $ref: "#/components/schemas/PaymentSplit"
        outbox_event_id:
          type: string
          format: uuid
        is_idempotent_replay:
          type: boolean

    InitiatePaymentRequest:
      type: object
      required: [idempotency_key, method]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
        split_id:
          type: string
          format: uuid
          description: Required only when the order has more than one payment split.
        method:
          $ref: "#/components/schemas/PaymentMethod"
        bank:
          type: string
          enum: [bca, bni, bri, mandiri, permata]
          description: Required only when `method` is `bank_transfer`
        amount:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional partial tender for direct methods (cash, static_qris, edc), decision V12. Omitted pays
            the whole remaining balance of the split. Several direct tenders may close one bill; a partial
            tender is refused (409 SPLIT_PAYMENT_PENDING) while a gateway attempt is pending. Gateway
            methods (qris, gopay, shopeepay, bank_transfer) always charge exactly the remaining balance;
            any other amount answers 409 GATEWAY_AMOUNT_MUST_BE_REMAINING. Out of range answers 422.
        cash_tendered_amount:
          type: integer
          format: int64
          description: >-
            Required when `method` is `cash`; must cover the tendered amount. When this cash tender closes
            the bill and store_settings.cash_rounding_step is set, it must cover the amount rounded to the
            nearest step (V11); the payment keeps the exact amount and records rounding_amount.
        reconciliation_ref:
          type: string
          maxLength: 100
          description: Required for `static_qris` and `edc` (bank/terminal reference)
        callback_url:
          type: string
          maxLength: 500
          description: Optional e-wallet deeplink return URL
        drawer_id:
          type: string
          format: uuid
          description: Optional target cash drawer; defaults to active cashier shift or store default drawer.

    StoreSettings:
      type: object
      properties:
        void_refund_owner_threshold:
          type: integer
          format: int64
          minimum: 0
          description: Void/refund above this amount (Rupiah) needs the owner PIN (O1). Default 100000.
        cashier_max_discount_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
          description: Largest discount a cashier may give without owner PIN, in basis points (O4). Default 1000 (10%).
        cash_variance_tolerance:
          type: integer
          format: int64
          minimum: 0
          description: Shift-close cash difference (Rupiah) above which a reason + owner PIN is required (C1). Default 5000.
        cashier_handles_bar:
          type: boolean
          description: Cashier also gets barista KDS and beverage availability permissions (C3). Default false.
        table_idle_close_minutes:
          type: integer
          minimum: 5
          maximum: 240
          description: Auto-close a table visit this long after all orders are paid and served (T1). Default 30.
        qr_ordering_paused:
          type: boolean
          description: Emergency pause for QR table ordering. Default false.
        static_qris_fallback_mode:
          type: string
          enum: ["off", auto, forced]
          description: Static QRIS fallback when Midtrans fails (K8). Default auto.
        refund_window_cashier_days:
          type: integer
          minimum: 0
          maximum: 30
          description: Business days after paid_at a cashier may refund alone (RF1-e). Default 0 (same day).
        refund_window_owner_days:
          type: integer
          minimum: 0
          maximum: 30
          description: Business days after paid_at the owner (or a cashier with owner PIN) may refund; at least the cashier window. Default 7.
        cash_rounding_step:
          type: integer
          enum: [0, 100, 500]
          description: Round the closing cash tender to the nearest step (V11); 0 disables. Never applied to non-cash methods and never taxed.
        outlet_daily_expense_limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: Cashier outlet-cash expenses per store day above this need an outlet_expense approval (V13). Default 0 (every cashier expense).
        default_opening_float:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: Opening float used when a shift opens without opening_float (V13). Default 0.
        cashier_sees_expected_cash:
          type: boolean
          description: When false (default) a cashier's X-report hides expected cash while the shift is open (blind count).

    InitiatePaymentResponse:
      type: object
      required: [payment, order, split, is_idempotent_replay]
      description: Mirrors `service.InitiatePaymentResult`.
      properties:
        is_idempotent_replay:
          type: boolean
        open_drawer:
          type: boolean
          description: True when cash drawer kick-pin solenoid signal should be triggered (for cash payment).
        payment:
          type: object
          required: [id, provider_order_id, method, status, amount]
          properties:
            id:
              type: string
              format: uuid
            provider_order_id:
              type: string
            method:
              $ref: "#/components/schemas/PaymentMethod"
            status:
              $ref: "#/components/schemas/PaymentStatus"
            amount:
              type: integer
              format: int64
            cash_tendered_amount:
              type: integer
              format: int64
            rounding_amount:
              type: integer
              format: int64
              description: Cash received minus amount on a rounded closing cash tender (V11)
            change_given_amount:
              type: integer
              format: int64
            qr_string:
              type: string
            deeplink_url:
              type: string
            va_number:
              type: string
            verified_by_user_id:
              type: string
              format: uuid
              description: Signed-in staff member who settled a direct tender.
            expires_at:
              type: ["string", "null"]
              format: date-time
        order:
          type: object
          description: The order after the payment (status, payment_status, totals).
        split:
          type: object
          description: The payment split that was paid or charged.

    MidtransWebhookPayload:
      type: object
      required: [order_id, status_code, gross_amount, signature_key, transaction_status]
      properties:
        transaction_time:
          type: string
          example: "2026-10-30 14:35:10"
        transaction_status:
          type: string
          example: settlement
        transaction_id:
          type: string
          example: 9b8a7c6d-1234-4321-8888-abcdef012345
        status_message:
          type: string
          example: midtrans payment notification
        status_code:
          type: string
          example: "200"
        signature_key:
          type: string
          description: Lowercase hex SHA-512 of `order_id + status_code + gross_amount + server_key`
        payment_type:
          type: string
          example: qris
        order_id:
          type: string
          example: ORD-20261030-0001-S1-A1
        gross_amount:
          type: string
          example: "83160.00"
        fraud_status:
          type: string
          example: accept
        currency:
          type: string
          example: IDR

    PublicCatalogResponse:
      type: object
      required: [store_id, slug, name, currency, tax_bps, service_bps, categories]
      properties:
        store_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        currency:
          type: string
          example: IDR
        tax_bps:
          type: integer
          example: 1000
        service_bps:
          type: integer
          example: 500
        categories:
          type: array
          items:
            type: object
            required: [id, name, products]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              products:
                type: array
                items:
                  type: object
                  required: [id, name, base_price, is_available]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
                    base_price:
                      type: integer
                      format: int64
                    image_url:
                      type: string
                    is_available:
                      type: boolean
                    stock_quantity:
                      type: integer

    ModifierGroupInput:
      type: object
      required: [name, selection_type, min_selection, max_selection]
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        selection_type:
          type: string
          enum: [single, multiple]
        min_selection:
          type: integer
          minimum: 0
        max_selection:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 0

    ModifierOptionInput:
      type: object
      required: [name, price_delta]
      properties:
        name:
          type: string
          maxLength: 120
        price_delta:
          type: integer
          format: int64
          description: Price adjustment in IDR (can be negative, e.g. -2000 per decision P1)
        is_available:
          type: boolean
        max_quantity:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 0

    AttachModifierGroupInput:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
          format: uuid
        display_order:
          type: integer
          minimum: 0
        override_required:
          type: boolean

    AttachChildGroupInput:
      type: object
      required: [child_group_id]
      properties:
        child_group_id:
          type: string
          format: uuid
        display_order:
          type: integer
          minimum: 0

    QuoteOrderRequest:
      type: object
      required: [order_type, items]
      properties:
        order_type:
          type: string
          enum: [dine_in, takeaway, delivery]
        billing_mode:
          type: string
          enum: [pay_first, open_tab, split_bill]
        table_number:
          type: string
        notes:
          type: string
        expected_total:
          type: integer
          format: int64
          description: Optional expected total for optimistic concurrency conflict check
        expected_quote_fingerprint:
          type: string
          description: Optional deterministic hash fingerprint of quote lines to prevent compensating price change conflicts
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    QuoteOrderResponse:
      type: object
      required: [quote]
      properties:
        quote:
          $ref: "#/components/schemas/QuoteSummary"

    QuoteSummary:
      type: object
      required: [subtotal, discount_amount, service_charge_amount, service_charge_rate_bps, tax_amount, tax_rate_bps, total_amount, quote_fingerprint, items]
      properties:
        subtotal:
          type: integer
          format: int64
        discount_amount:
          type: integer
          format: int64
        service_charge_amount:
          type: integer
          format: int64
        service_charge_rate_bps:
          type: integer
        tax_amount:
          type: integer
          format: int64
        tax_rate_bps:
          type: integer
        total_amount:
          type: integer
          format: int64
        quote_fingerprint:
          type: string
          description: Deterministic SHA-256 fingerprint hash of lines, snapshot prices, tax, and service fees
        items:
          type: array
          items:
            type: object
            properties:
              variant_id:
                type: string
                format: uuid
              product_id:
                type: string
                format: uuid
              product_name:
                type: string
              variant_name:
                type: string
              unit_price:
                type: integer
                format: int64
              quantity:
                type: integer
              subtotal:
                type: integer
                format: int64

    QuoteChangedErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, expected_total, actual_total, quote]
          properties:
            code:
              type: string
              enum: [QUOTE_CHANGED]
            message:
              type: string
            expected_total:
              type: integer
              format: int64
            actual_total:
              type: integer
              format: int64
            expected_fingerprint:
              type: string
            actual_fingerprint:
              type: string
            quote:
              $ref: "#/components/schemas/QuoteSummary"
