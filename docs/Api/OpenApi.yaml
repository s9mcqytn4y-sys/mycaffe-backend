      properties:
        category_id:
          type: string
          format: uuid
        clear_category:
          type: boolean
          description: PATCH only; set true to remove the category.
        name:
          type: string
          maxLength: 120
          description: Required on create; unique per store (case-insensitive) among active products.
        description:
          type: string
          maxLength: 1000
        product_type:
          type: string
          enum: [prepared, ready_to_serve]
        prep_station:
          type: string
          enum: [bar, kitchen, none]
        display_order:
          type: integer
          minimum: 0
          maximum: 10000
        is_available:
          type: boolean
        track_stock:
          type: boolean
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        variants:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VariantInput"
          description: Create only (at least one).
