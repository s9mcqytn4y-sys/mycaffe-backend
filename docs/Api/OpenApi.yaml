        reference_id: {type: string, format: uuid, description: "Order (void), payment (refund), product (stock_override) or shift (shift_variance)"}
        params:
          type: object
          properties:
            new_quantity: {type: integer, minimum: 0, description: Required for stock_override}
            counted_cash: {type: integer, format: int64, minimum: 0, description: Required for shift_variance}
            amount: {type: integer, format: int64, minimum: 1, description: "Required for outlet_expense; reference_id is ignored (the store fund)"}
            category: {type: string, enum: [ingredients, operational, other], description: Required for outlet_expense}
        reason: {type: string}
    Approval:
      type: object
      required: [id, action, reference_id, reference_label, amount, params, reason, status, requested_by_name, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [void, refund, stock_override, shift_variance, outlet_expense]}
        reference_id: {type: string, format: uuid}
        reference_label: {type: string, description: "Order number, product name or drawer name"}
        amount: {type: integer, format: int64, description: "Server-computed; signed for shift_variance"}
        params: {type: object}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, rejected, consumed, expired]}
        requested_by_name: {type: string}
        decided_by_name: {type: string}
        decision_note: {type: string}
        expires_at: {type: string, format: date-time, description: "Deadline to decide (pending) or to use (approved)"}
        decided_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    ValidationErrorResponse:
      type: object
