  /api/v1/pos/orders/{id}/receipt:
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Sale, refund or void receipt from the order snapshots, as JSON or ESC/POS bytes (B1)
      description: >-
        Amounts come only from the order, item, option and payment snapshots; nothing is recalculated
        from the catalog or current store rates. Tax and service are shown as amounts (no percent) until
        rates are frozen per order (DB0). format=escpos returns raw bytes for 58 mm (32 columns) or 80 mm
        (48 columns) printers; for kind=sale it also issues a new 90-day digital receipt link and prints it
        as a QR code (GS ( k). Non-ASCII characters print as "?". A by-item split refund lists only the
        lines of that split.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            type: string
            enum: [sale, refund, void]
            default: sale
        - name: payment_id
          in: query
          description: Required for kind=refund; the refunded payment.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [json, escpos]
            default: json
        - name: width
          in: query
          description: Paper width in mm (ESC/POS only).
          schema:
            type: integer
            enum: [58, 80]
            default: 58
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: INVALID_ID
        "403":
          description: Forbidden - lacks order.read.store
        "404":
          description: NOT_FOUND (order or payment)
        "409":
          description: RECEIPT_NOT_AVAILABLE (refund receipt of an unrefunded payment, void receipt of an order that was not voided)
        "422":
          description: VALIDATION_FAILED (kind, payment_id, format, width)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/v1/pos/orders/{id}/receipt-link:
    post:
      tags: [Receipts]
      operationId: issueReceiptLink
      summary: Issue a 90-day digital receipt link (decision R1)
      description: >-
        The token (store_id.token_id.secret) is returned once; only the SHA-256 of the secret is stored.
        Every call issues a new token and older ones stay valid until they expire. url is
        APP_PUBLIC_URL/receipts/{token}.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Link issued
          content:
            application/json:
              schema:
                type: object
                required: [token, url, expires_at]
                properties:
                  token:
                    type: string
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: INVALID_ID
        "403":
          description: Forbidden - lacks order.read.store
        "404":
          description: NOT_FOUND
  /api/v1/public/receipts/{token}:
    get:
      security: []
      tags: [Receipts]
      operationId: getPublicReceipt
      summary: Digital receipt behind a link token (sale receipt with current refund totals)
      description: No customer or staff names. Unknown, tampered, expired or other-store tokens all answer 404.
      x-implementation-status: implemented
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "404":
