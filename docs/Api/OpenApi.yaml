  /ws:
    get:
      security: []
      tags: [Realtime]
      operationId: connectWebSocket
      summary: WebSocket upgrade with a ticket; replays missed events after last_seq
      description: >-
        The ticket is consumed on first use and re-checks its subject (staff session live and user active,
        or guest session valid). Messages are JSON `{seq, type, store_id, payload}`, one per frame, delivered
        at least once in per-store sequence order; clients keep the highest seq and deduplicate. With
        last_seq, events after it are replayed (filtered to the ticket's channels); more than 500 missed
        events yield a single `resync_required` and the client reloads over REST. Staff channels get the
        full outbox payload; a guest gets only order_id, order_number, queue_number, status and
        payment_status of its own orders. Origin must be in ALLOWED_ORIGINS. An open connection re-checks
        its subject every 30 s and is closed once the staff session is revoked, expired or logged out, the
        account is deactivated or locked, or the guest session ended; the client then needs a new ticket.
        Concurrent connections are capped per guest session (3), client IP (20) and store (150).
      x-implementation-status: implemented
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
        - name: last_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: Switching protocols
        "401":
          description: WS_TICKET_REQUIRED or WS_TICKET_INVALID (unknown, used, expired, or subject no longer valid)
        "429":
          description: WS_CONNECTION_LIMIT (a connection cap is reached; the ticket is consumed)
