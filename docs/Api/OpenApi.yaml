openapi: 3.1.0
info:
  title: MyCaffe Core POS API
  version: 0.4.0
  summary: Multi-tenant QR Table Ordering, POS Cashier, Kitchen Display System (KDS), and Payment Reconciliation API
  description: |
    Official OpenAPI 3.1 contract for **MyCaffe Core POS** backend (`mycaffe-backend`).
    All monetary values are represented as whole integer Indonesian Rupiah (`int64`, e.g. `24000` = Rp 24.000) without floating-point numbers.
    Percentage rates (PB1 tax, service charge, QRIS MDR) are represented in Basis Points (`1% = 100 bps`).
  contact:
    name: MyCaffe Platform Engineering
servers:
  - url: http://localhost:8080
    description: Local Development API Server
  - url: https://api.example.com
    description: Production Single-VPS Hostinger KVM 2 Reverse Proxy (Nginx TLS)
tags:
  - name: Health
    description: Liveness and readiness probes for Docker Compose and Nginx
  - name: Catalog
    description: Public and staff menu catalog, modifier groups, and 1-level sub-addons
  - name: Orders
    description: Transactional order creation, stock reservation lifecycle, and real-time order tracking
  - name: Payments
    description: Payment initiation (QRIS, VA, E-Wallet, Cash, Static QRIS, EDC) and Midtrans webhook reconciliation
  - name: Auth
    description: "Staff authentication and session lifecycle (ADR-003). Implemented in Phase 02.01-B (login, refresh, logout, me)."
  - name: Staff
    description: Owner staff management - invitation, PIN reset link, temporary PIN (owner decision E2)
  - name: KDS
    description: Kitchen Display System and Barista preparation queue transitions
  - name: Tables
    description: Tables, derived table occupancy, table sessions and public QR resolution (iteration 5a)
  - name: Guest
    description: QR guest sessions, pay-first guest orders and the public order tracker (iteration 5b)
  - name: Realtime
    description: Outbox relay over WebSocket with single-use tickets, per-store sequence and replay (iteration 5c)
  - name: Customers
    description: Customer phone verification by SMS code (V4); verified phones unlock receipts, points and invoices later
  - name: Approvals
    description: Remote owner approval from the phone for void, refund, stock override and shift variance (ADR-007)
  - name: Receipts
    description: Snapshot-only sale, refund and void receipts (JSON or ESC/POS) and 90-day digital receipt links (B1, decision R1)
  - name: Reports
    description: Read-only owner sales reports per business day, method, category, item and hour, JSON or CSV (B2)
  - name: Media
    description: Presigned product image uploads to R2, verified and resized into metadata-free JPEG variants (B3, decision K9)

paths:
  /health:
    get:
      security: []
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusResponse"

  /health/ready:
    get:
      security: []
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe (verifies PostgreSQL 18 connection pool)
      responses:
        "200":
          description: Database connection pool is healthy and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusResponse"
        "503":
          description: Database connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/public/stores/{store_slug}/catalog:
    get:
      security: []
      tags: [Catalog]
      operationId: getPublicStoreCatalog
      summary: Guest menu of a store (categories, products, variants, modifier groups)
      x-implementation-status: implemented
      description: |
        Inactive categories and archived products are hidden; unavailable items stay listed with
        `available=false` and `sold_out_reason`. Stock counts are not exposed. Responses carry a content
        `ETag` (excluding `generated_at`) and `Cache-Control: public, max-age=30`; send `If-None-Match`
        to get `304`.
      parameters:
        - name: store_slug
          in: path
          required: true
          schema:
            type: string
            example: central-cafe
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Menu
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogView"
        "304":
          description: Not modified
        "404":
          description: Store not found or inactive (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/public/stores/{store_slug}/orders/quote:
    parameters:
      - name: store_slug
        in: path
        required: true
        schema:
          type: string
        description: URL slug identifier of the cafe store
    post:
      tags: [Orders]
      operationId: getPublicOrderQuote
      summary: Lock-free calculation of subtotal, discounts, PB1 tax, and service charge for guest order
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteOrderRequest"
      responses:
        "200":
          description: Calculated quote summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order quote total changed compared to client expected total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteChangedErrorResponse"

  /api/v1/pos/catalog:
    get:
      tags: [Catalog]
      operationId: getStaffCatalog
      summary: POS menu for signed-in staff (includes inactive categories and stock counts)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogView"
        "304":
          description: Not modified

  /api/v1/catalog/categories:
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Create a category (owner, catalog.manage)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateCategory
      summary: Update a category (partial)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: deleteCategory
      summary: Delete a category (its products remain, uncategorized)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products:
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a product with its variants (owner)
      x-implementation-status: implemented
      description: At least one variant; exactly one default when there are several (a single variant becomes the default). `base_price` follows the default variant. SKUs are normalized to upper case.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product with variants
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update product fields (partial; variants have their own endpoints)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: archiveProduct
      summary: Archive a product and its variants (order history keeps its snapshots)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: setProductAvailability
      summary: Mark a product available or sold out
      x-implementation-status: implemented
      description: Bar items need `item.availability.toggle.beverage` (barista, owner, cashier with `cashier_handles_bar`); kitchen items need `item.availability.toggle.food`.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        "204":
          description: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: createVariant
      summary: Add a variant to a product (owner)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "201":
          description: Created
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/variants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateVariant
      summary: Update a variant (partial); price changes are audited (PRICE_CHANGE)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: archiveVariant
      summary: Archive a non-default variant
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-groups:
    get:
      tags: [Catalog]
      operationId: listModifierGroups
      summary: List all active modifier groups for the tenant
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: List of modifier groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  modifier_groups:
                    type: array
                    items:
                      type: object
                      description: Modifier group with its options (see ModifierGroupInput for writable fields).
    post:
      tags: [Catalog]
      operationId: createModifierGroup
      summary: Create a new modifier group
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/modifier-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Catalog]
      operationId: getModifierGroup
      summary: Get modifier group details with options and child groups
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Modifier group details
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Catalog]
      operationId: updateModifierGroup
      summary: Update a modifier group (partial)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalog]
      operationId: archiveModifierGroup
      summary: Archive a modifier group (soft delete and optional force unlink)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Force archive by unlinking from products and parent options
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-groups/{id}/options:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: createModifierOption
      summary: Add an option to a modifier group (supports negative delta P1)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierOptionInput"
      responses:
        "201":
          description: Option created
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/modifier-groups/{id}/options/{option_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: option_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      operationId: updateModifierOption
      summary: Update a modifier option (partial; price changes are audited)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierOptionInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalog]
      operationId: archiveModifierOption
      summary: Archive a modifier option
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/modifier-groups:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: attachModifierGroupToProduct
      summary: Link a modifier group to a product
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachModifierGroupInput"
      responses:
        "204":
          description: Linked
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/products/{id}/modifier-groups/{group_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Catalog]
      operationId: detachModifierGroupFromProduct
      summary: Unlink a modifier group from a product
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Unlinked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/modifier-options/{id}/child-groups:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: attachChildGroupToOption
      summary: Attach a modifier group as a child sub-addon to an option (max depth 1, cycle protected)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachChildGroupInput"
      responses:
        "204":
          description: Attached
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-options/{id}/child-groups/{group_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Catalog]
      operationId: detachChildGroupFromOption
      summary: Detach a child modifier group from an option
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Detached
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pos/customers/verify:
    post:
      tags: [Customers]
      operationId: startCustomerVerification
      summary: Upsert a customer by phone and text a verification code (V4, order.pos.create)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                name:
                  type: string
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id: {type: string, format: uuid}
                  customer_id: {type: string, format: uuid}
                  phone: {type: string}
                  expires_at: {type: string, format: date-time}
        "422":
          description: VALIDATION_FAILED (phone, name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: OTP_RATE_LIMITED (one code per minute, 5 per hour per phone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SMS_UNAVAILABLE (SMS_DRIVER=disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/pos/customers/verify/{id}/confirm:
    post:
      tags: [Customers]
      operationId: confirmCustomerVerification
      summary: Confirm the code read out by the customer; marks the phone verified (audited)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Verified customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  phone: {type: string}
                  name: {type: string}
                  phone_verified_at: {type: string, format: date-time}
        "400":
          description: OTP_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/pos/orders:
    get:
      tags: [Orders]
      operationId: listPosOrders
      summary: List store orders, newest first, with keyset pagination (v0.7 G-1, G-2)
      x-implementation-status: implemented
      description: |
        Permission `order.read.store`. Sorted by `created_at` then `id`, descending. Open tabs (G-2) are
        `billing_mode=open_tab&status=open`; a closed tab awaiting payment is `status=pending_payment`.
        The date window uses the store time zone (default today, at most 92 days). Pass `next_cursor` as
        `after` for the next page; it is `null` on the last page. The list omits customer phone numbers.
        Refetch after `order.*` events on the `pos` WebSocket channel.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: status
          in: query
          description: Comma-separated order statuses, e.g. open,pending_payment.
          schema:
            type: string
        - name: payment_status
          in: query
          description: Comma-separated order payment statuses.
          schema:
            type: string
        - name: billing_mode
          in: query
          description: Comma-separated billing modes (pay_first, open_tab, split_bill).
          schema:
            type: string
        - name: from
          in: query
          description: First calendar day (YYYY-MM-DD, store time zone). Default today.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last calendar day, inclusive. Default from.
          schema:
            type: string
            format: date
        - name: shift_id
          in: query
          description: Orders settled in this shift.
          schema:
            type: string
            format: uuid
        - name: table_id
          in: query
          description: Orders of this table.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Prefix of the order number or queue number (letters, digits, hyphen; max 30).
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: after
          in: query
          description: Opaque cursor from next_cursor.
          schema:
            type: string
      responses:
        "200":
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing `order.read.store` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION_FAILED (status, payment_status, billing_mode, from, to, shift_id, table_id, q, limit, after)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    post:
      tags: [Orders]
      operationId: createPosOrder
      summary: Create a POS order (cashier/owner)
      x-implementation-status: implemented
      description: |
        Permission `order.pos.create`. The store and the acting user come only from the access token;
        any `store_id` or `actor_user_id` in the body is ignored. Prices, taxes, service charge, stock and
        modifiers are recomputed server-side. Replaying the same `idempotency_key` with the same payload
        returns the original order (200); a different payload returns 409.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
        "200":
          description: Idempotent replay of an existing order
        "400":
