    HealthStatusResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: mycaffe-api

    Receipt:
      type: object
      description: Receipt built only from order, item, option and payment snapshots (B1).
      required: [kind, store, order_id, order_number, queue_number, order_type, status, payment_status, issued_at, local_time, lines, subtotal_amount, discount_amount, tax_amount, service_charge_amount, total_amount, paid_amount, refunded_amount, payments]
      properties:
        kind:
          type: string
          enum: [sale, refund, void]
        store:
          type: object
          required: [name]
          properties:
            name: {type: string}
            address: {type: string}
            phone: {type: string}
        order_id: {type: string, format: uuid}
        order_number: {type: string}
        queue_number: {type: string}
        table_number: {type: string}
        order_type: {type: string}
        status: {type: string}
        payment_status: {type: string}
        issued_at:
          type: string
          format: date-time
          description: Order time (sale), refund time (refund) or void time (void).
        local_time:
          type: string
          description: issued_at in the store time zone, dd/mm/yyyy hh:mm.
        staff_name:
          type: string
          description: Cashier (sale), refunding or voiding staff; omitted on the public receipt.
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, unit_price, amount]
            properties:
              name: {type: string}
              variant: {type: string}
              options:
                type: array
                description: Option names; nested sub-options start with "- ".
                items: {type: string}
              notes: {type: string}
              quantity: {type: integer}
              unit_price: {type: integer, format: int64, description: "Snapshot unit price incl. modifiers (IDR)"}
              amount: {type: integer, format: int64}
        subtotal_amount: {type: integer, format: int64}
        discount_amount: {type: integer, format: int64}
        tax_amount: {type: integer, format: int64}
        service_charge_amount: {type: integer, format: int64}
        total_amount: {type: integer, format: int64}
        paid_amount: {type: integer, format: int64}
        refunded_amount: {type: integer, format: int64}
        payments:
          type: array
          items:
            type: object
            required: [method, amount, status]
            properties:
              split_label: {type: string}
              method: {type: string}
              amount: {type: integer, format: int64}
              cash_tendered_amount: {type: integer, format: int64}
              change_amount: {type: integer, format: int64}
              rounding_amount: {type: integer, format: int64, description: "Cash rounding of this tender (V11); printed as Pembulatan"}
              status: {type: string}
        refund:
          type: object
          required: [payment_id, method, amount, reason, stock_returned]
          properties:
            payment_id: {type: string, format: uuid}
            method: {type: string}
            amount: {type: integer, format: int64}
            reason: {type: string}
            stock_returned: {type: boolean}
        void_reason: {type: string}
    SalesReport:
      type: object
      required: [from, to, group, rows]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        group:
          type: string
          enum: [day, hour, method, category, item]
        rows:
          type: array
          items:
            type: object
            required: [key, gross_sales, discount_amount, tax_amount, service_charge_amount, total_amount, refunded_amount, net_amount]
            properties:
              key:
                type: string
                description: Date (YYYY-MM-DD), local hour (00-23), payment method, category name ("Tanpa kategori" when none) or "item (variant)".
              orders: {type: integer, format: int64, description: "Orders (day, hour, category, item)"}
              payments: {type: integer, format: int64, description: Payments (method)}
              quantity: {type: integer, format: int64, description: "Units sold (category, item)"}
              gross_sales: {type: integer, format: int64, description: "Subtotal before discount (orders) or payment amount (method)"}
              discount_amount: {type: integer, format: int64}
              tax_amount: {type: integer, format: int64}
              service_charge_amount: {type: integer, format: int64}
              total_amount: {type: integer, format: int64}
              refunded_amount: {type: integer, format: int64}
              net_amount: {type: integer, format: int64}
    ReportSummary:
      type: object
      required: [from, to, orders, gross_sales, discount_amount, tax_amount, service_charge_amount, total_amount, refunded_amount, net_amount, void_count, void_amount, refunds_by_method, cash_sales, cash_refunds, cash_net]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        orders: {type: integer, format: int64}
        gross_sales: {type: integer, format: int64}
        discount_amount: {type: integer, format: int64}
        tax_amount: {type: integer, format: int64}
        service_charge_amount: {type: integer, format: int64}
        total_amount: {type: integer, format: int64}
        refunded_amount: {type: integer, format: int64}
        net_amount: {type: integer, format: int64}
        void_count: {type: integer, format: int64}
        void_amount: {type: integer, format: int64}
        refunds_by_method:
          type: array
          items:
            type: object
            required: [method, count, amount]
            properties:
              method: {type: string}
              count: {type: integer, format: int64}
              amount: {type: integer, format: int64}
        cash_sales: {type: integer, format: int64}
        cash_refunds: {type: integer, format: int64}
        cash_net: {type: integer, format: int64}
        cash_rounding: {type: integer, format: int64, description: "Net cash rounding inside cash_sales (V11); not part of total_amount"}
        outlet_expenses: {type: integer, format: int64, description: "Outlet cash fund expenses in the range (V13), outside the drawers"}
    ErrorResponse:
      type: object
