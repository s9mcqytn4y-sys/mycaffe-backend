  /api/v1/pos/approvals:
    post:
      tags: [Approvals]
      operationId: createApproval
      summary: Ask the owner's phone to approve one void, refund, stock override or shift variance (ADR-007)
      x-implementation-status: implemented
      description: |
        Needs the permission of the underlying action; owners use their PIN directly and get 403. The
        server computes amount and label from the reference: order total (void), payment amount
        (refund), new quantity (stock override), or signed cash variance from counted_cash (shift).
        The owner has 2 minutes to decide; after approval the requester has 2 minutes to use it.
        Emits approval.requested on the owner WebSocket channel.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
      responses:
        "201":
          description: Approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "403":
          description: FORBIDDEN (missing the action permission, or the caller is an owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND (reference not in the store, already voided, or not refundable/open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: APPROVAL_NOT_NEEDED (within the cashier own limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION_FAILED (action, reference_id, reason, params.new_quantity, params.counted_cash)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: APPROVAL_LIMIT (3 pending requests per cashier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/pos/approvals/{id}:
    get:
      tags: [Approvals]
