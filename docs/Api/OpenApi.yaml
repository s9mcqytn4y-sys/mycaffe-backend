        "403":
          description: FORBIDDEN / APPROVAL_SELF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: APPROVAL_NOT_PENDING / APPROVAL_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/pos/orders/{id}/void:
    post:
      tags: [POS Operational]
      operationId: voidOrder
      summary: Void an order with no money attached (Iteration 4d, hotfix v0.4.3)
      description: >-
        Allowed only while the order has no paid, partially refunded, refunded, pending or authorized
        payment (on the order or any split); otherwise 409 ORDER_HAS_PAYMENTS (use refund). Returns the
        stock the order still holds exactly once (products and modifier options, stock_status becomes
        released), cancels every round, and writes an order.cancelled outbox event. Wrong PINs count
        toward the same lockout as login.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Pelanggan membatalkan pesanan sebelum dibuat"
                pin:
                  type: string
                  example: "123456"
                owner_pin:
                  type: string
                  example: "482913"
                approval_id:
                  type: string
                  format: uuid
                  description: Approved remote request (ADR-007) used instead of owner_pin; consumed once. 409 APPROVAL_INVALID when it does not match.
      responses:
        "200":
          description: Order voided successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
        "401":
          description: INVALID_STAFF_PIN or INVALID_OWNER_PIN
        "403":
          description: Forbidden - lacks order.void permission
        "404":
          description: Order not found
        "409":
          description: ORDER_HAS_PAYMENTS or ORDER_ALREADY_CANCELLED
        "422":
          description: VALIDATION_FAILED (reason/pin) or OWNER_PIN_REQUIRED above void_refund_owner_threshold
        "429":
          description: >-
            PIN_LOCKED (actor or every owner locked), PIN_ATTEMPTS_EXCEEDED (STAFF_PIN_MAX_FAILURES wrong owner
            PINs by this actor per STAFF_PIN_LOCKOUT window) or OWNER_PIN_STORE_LIMIT (3x that many from all staff
            of the store; owners are emailed once)

  /api/v1/pos/orders/{id}/payments/{payment_id}/refund:
    post:
      tags: [POS Operational]
      operationId: refundPayment
      summary: Refund one settled payment or split, in cash from the drawer or by the owner's bank transfer (4d, RF1-c, RF1-e)
      description: >-
        Full refund of one payment of any method once the order is paid or partially refunded (RF1-c).
        refund_method=cash (default) pays back from the actor's open drawer; bank_transfer is recorded by
        the owner only, with bank name, the last 4 account digits and the transfer reference, and does not
        touch the drawer. The payment keeps its original method; each refund is one row of the append-only
        payment_refunds ledger. Refund windows (RF1-e, store settings, business days in the store time
        zone from paid_at): past refund_window_cashier_days a cashier needs owner_pin; past
        refund_window_owner_days nobody can refund in the system. restore_stock is required: for a by_item split it restores only that
        split's lines; otherwise the whole order is restored once, when this refund makes the order
        fully refunded. Updates payments.refunded_amount, orders.refunded_amount and the split status.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, restore_stock]
              properties:
                reason:
                  type: string
                  example: "Kopi tumpah oleh kasir, refund tunai"
                pin:
                  type: string
                  example: "123456"
                owner_pin:
                  type: string
                  example: "482913"
                approval_id:
                  type: string
                  format: uuid
                  description: Approved remote request (ADR-007) used instead of owner_pin; consumed once. 409 APPROVAL_INVALID when it does not match.
                restore_stock:
                  type: boolean
                  description: true returns the goods to stock; false records them as waste. No default.
                refund_method:
                  type: string
                  enum: [cash, bank_transfer]
                  default: cash
                bank_name:
                  type: string
                  maxLength: 100
                  description: Required for bank_transfer.
                account_last4:
                  type: string
                  pattern: "^[0-9]{4}$"
                  description: Required for bank_transfer; the full account number is never stored.
                transfer_reference:
                  type: string
                  maxLength: 100
                  description: Required for bank_transfer.
      responses:
        "200":
          description: Refund processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: "#/components/schemas/InitiatePaymentResponse/properties/payment"
                  order:
                    $ref: "#/components/schemas/Order"
                  open_drawer:
                    type: boolean
                  stock_restored:
                    type: boolean
                  message:
                    type: string
        "401":
          description: INVALID_STAFF_PIN or INVALID_OWNER_PIN
        "404":
          description: Order or payment not found (or payment belongs to another order)
        "409":
          description: >-
            NO_OPEN_SHIFT, INSUFFICIENT_DRAWER_CASH, PAYMENT_ALREADY_REFUNDED, NOT_REFUNDABLE (payment not
            paid or order not fully paid yet), or REFUND_WINDOW_EXCEEDED (paid before the owner window)
        "403":
          description: FORBIDDEN (lacks payment.refund, or bank_transfer by anyone but the owner)
        "422":
          description: >-
            VALIDATION_FAILED (reason, restore_stock, pin, refund_method, bank_name, account_last4,
            transfer_reference) or OWNER_PIN_REQUIRED (above void_refund_owner_threshold, or a cashier past
