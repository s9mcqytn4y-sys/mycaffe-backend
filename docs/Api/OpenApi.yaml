          type: string
        store_slug:
          type: string
        table_number:
          type: string
        label:
          type: string
        ordering_open:
          type: boolean
        closed_reason:
          type: string
          enum: [paused, store_closed, table_inactive]
    CashDrawer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        name:
          type: string
