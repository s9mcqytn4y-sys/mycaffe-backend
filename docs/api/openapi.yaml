          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderResponse"
        "401":
          description: GUEST_SESSION_EXPIRED
        "409":
          description: QUOTE_CHANGED, UNPAID_ORDER_LIMIT, QR_ORDERING_PAUSED, STORE_CLOSED, TABLE_INACTIVE, UNAVAILABLE
          content:
            application/json:
              schema:
