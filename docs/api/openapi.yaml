      type: object
      required: [access_token, token_type, access_token_expires_at, session_expires_at, staff]
      properties:
        access_token:
          type: string
          description: Keep in memory only; never persist to localStorage.
        token_type:
          type: string
          enum: [Bearer]
        access_token_expires_at:
          type: string
          format: date-time
        session_expires_at:
          type: string
          format: date-time
