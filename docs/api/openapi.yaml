    post:
      security: []
      tags: [Guest]
      operationId: createGuestOrder
      summary: Place a pay-first dine-in QR order for the guest's table (T2)
      description: >-
        Requires `X-CSRF-Protection: 1`. Re-priced server-side; `expected_total` mismatch answers 409
        QUOTE_CHANGED. Idempotency keys are namespaced per guest session. At most 2 unpaid orders per
        guest session and 6 per table session; 10 attempts per guest session per 10 minutes; at most
        30 items, quantity 1..20 per line (QR5). Price the cart first with
        `POST /api/v1/public/stores/{store_slug}/orders/quote`.
      x-implementation-status: implemented
      parameters:
