  /api/v1/pos/orders/{id}/void:
    post:
      tags: [POS Operational]
      operationId: voidOrder
      summary: Void an order with no money attached (Iteration 4d, hotfix v0.4.3)
      description: >-
        Allowed only while the order has no paid, partially refunded, refunded, pending or authorized
        payment (on the order or any split); otherwise 409 ORDER_HAS_PAYMENTS (use refund). Returns the
        stock the order still holds exactly once (products and modifier options, stock_status becomes
        released), cancels every round, and writes an order.cancelled outbox event. Wrong PINs count
        toward the same lockout as login.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Pelanggan membatalkan pesanan sebelum dibuat"
                pin:
                  type: string
                  example: "123456"
                owner_pin:
                  type: string
                  example: "482913"
      responses:
        "200":
          description: Order voided successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
        "401":
          description: INVALID_STAFF_PIN or INVALID_OWNER_PIN
        "403":
          description: Forbidden - lacks order.void permission
        "404":
          description: Order not found
        "409":
          description: ORDER_HAS_PAYMENTS or ORDER_ALREADY_CANCELLED
        "422":
          description: VALIDATION_FAILED (reason/pin) or OWNER_PIN_REQUIRED above void_refund_owner_threshold
        "429":
          description: PIN_LOCKED (actor or every owner locked) or PIN_ATTEMPTS_EXCEEDED (5 wrong owner PINs by this actor in 15 min)

  /api/v1/pos/orders/{id}/payments/{payment_id}/refund:
    post:
      tags: [POS Operational]
      operationId: refundPayment
      summary: Refund one settled cash payment or split from the open drawer (Iteration 4d, hotfix v0.4.3)
      description: >-
        Full refund of one cash payment once the order is paid or partially refunded. Non-cash
        methods answer 409 REFUND_METHOD_NOT_SUPPORTED until the non-cash refund policy (decision
        register RF1) is approved. restore_stock is required: for a by_item split it restores only that
        split's lines; otherwise the whole order is restored once, when this refund makes the order
        fully refunded. Updates payments.refunded_amount, orders.refunded_amount and the split status.
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, restore_stock]
              properties:
                reason:
                  type: string
                  example: "Kopi tumpah oleh kasir, refund tunai"
                pin:
                  type: string
                  example: "123456"
                owner_pin:
                  type: string
                  example: "482913"
                restore_stock:
                  type: boolean
                  description: true returns the goods to stock; false records them as waste. No default.
      responses:
        "200":
          description: Refund processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: "#/components/schemas/InitiatePaymentResponse/properties/payment"
                  order:
                    $ref: "#/components/schemas/Order"
                  open_drawer:
                    type: boolean
                  stock_restored:
                    type: boolean
                  message:
                    type: string
        "401":
          description: INVALID_STAFF_PIN or INVALID_OWNER_PIN
        "404":
          description: Order or payment not found (or payment belongs to another order)
        "409":
          description: >-
            NO_OPEN_SHIFT, INSUFFICIENT_DRAWER_CASH, PAYMENT_ALREADY_REFUNDED, NOT_REFUNDABLE (payment not
            paid or order not fully paid yet) or REFUND_METHOD_NOT_SUPPORTED (non-cash)
        "422":
          description: VALIDATION_FAILED (reason, restore_stock, pin) or OWNER_PIN_REQUIRED
        "429":
          description: PIN_LOCKED or PIN_ATTEMPTS_EXCEEDED

  /api/v1/pos/products/{id}/stock-override:
    post:
      tags: [POS Operational]
      operationId: overrideStock
      summary: Manually adjust product physical stock with mandatory Owner PIN authorization (Iteration 4d)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_quantity, reason, owner_pin]
              properties:
                new_quantity:
                  type: integer
                  minimum: 0
                  example: 25
                reason:
                  type: string
                  example: "Stock opname fisik harian penutupan"
                owner_pin:
                  type: string
                  example: "482913"
                enable_tracking:
                  type: boolean
                  default: false
                  description: Must be true to override a product whose stock is not tracked yet.
      responses:
        "200":
          description: Stock adjusted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_id:
                    type: string
                    format: uuid
                  product_name:
                    type: string
                  previous_quantity:
                    type: integer
                  new_quantity:
                    type: integer
                  delta:
                    type: integer
                  message:
                    type: string
        "401":
          description: INVALID_OWNER_PIN
        "403":
          description: Forbidden - lacks stock.override permission
        "404":
          description: Product not found
        "422":
          description: VALIDATION_FAILED (negative quantity, missing reason/PIN) or PRODUCT_NOT_TRACKED
        "429":
          description: PIN_LOCKED or PIN_ATTEMPTS_EXCEEDED

  /api/v1/store/settings:
    get:
      tags: [Staff]
      operationId: getStoreSettings
      summary: Read the store's operating policies (any signed-in staff)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Current settings (defaults when never changed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    patch:
      tags: [Staff]
      operationId: updateStoreSettings
      summary: Change operating policies (owner)
      x-implementation-status: implemented
      description: Partial update; omitted fields keep their value. Permission `store.settings.manage`. Every change is audited (`STORE_SETTINGS_CHANGED`) with before/after values. Permission changes such as `cashier_handles_bar` apply to the next request without re-login.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
        "400":
          description: Out-of-range value (`INVALID_SETTINGS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/payments/midtrans/webhook:
    post:
      security: []
      tags: [Payments]
      operationId: handleMidtransWebhook
      summary: Midtrans HTTP Notification Webhook
      description: |
        Status in Roadmap - Implemented & Tested (Phase 01 Sub-task 04).
        Verifies `SHA512(order_id + status_code + gross_amount + server_key)`, validates `IDR` currency and whole-integer `gross_amount`, resolves tenant context via `resolve_payment_webhook_context`, and durably commits the notification inbox, payment status, split, order state, stock reservation, and outbox event in one tenant-scoped PostgreSQL 18 transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MidtransWebhookPayload"
      responses:
        "200":
          description: Webhook verified and durably committed to payment_notification_logs, payments, payment_splits, orders, and outbox_events
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Malformed JSON, missing fields, non-IDR currency, or fractional gross_amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid SHA-512 signature key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Webhook body exceeds 64 KB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Signature verified, deferred for retry while durable payment transaction is uncommitted
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/auth/staff/login:
    post:
      tags: [Auth]
      operationId: staffLogin
      summary: Staff login with store slug, email, and PIN
      x-implementation-status: implemented
      x-adr: ADR-003 D1-D5
      description: |
        Verifies `store_slug + email + PIN`. Every failure (unknown store, unknown email, inactive or locked
        account, wrong PIN) returns the same generic `401 INVALID_CREDENTIALS`. On success returns a 15-minute
        access token in the body and sets the rotating refresh token as an HttpOnly cookie.
        Responses carry `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: "`__Secure-mc_staff_rt=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/staff`"
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionResponse"
        "400":
          description: Malformed request body (missing field, non-numeric PIN, PIN length outside 6-12)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Generic authentication failure (`code=INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited by IP or hashing concurrency cap (`code=RATE_LIMITED`)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/refresh:
    post:
      tags: [Auth]
      operationId: staffRefresh
      summary: Rotate refresh token and issue a new access token
      x-implementation-status: implemented
      x-adr: ADR-003 D4
      description: |
        Consumes the refresh cookie, rotates it, and returns a new access token. Presenting an already-rotated
        refresh token revokes the whole session (reuse detection). The session never outlives its 12-hour
        absolute lifetime.
      security:
        - StaffRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfProtectionHeader"
      responses:
        "200":
          description: Rotated
          headers:
            Set-Cookie:
              description: Replacement refresh cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionResponse"
        "401":
          description: Missing, expired, revoked, or reused refresh token (`code=SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The previous refresh generation arrived within 30 s of a rotation (concurrent tabs). Session kept; retry with the current cookie (`code=REFRESH_RACE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing `X-CSRF-Protection` header (`code=CSRF_HEADER_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/logout:
    post:
      tags: [Auth]
      operationId: staffLogout
      summary: Revoke the current staff session
      x-implementation-status: implemented
      x-adr: ADR-003 D4
      description: Revokes the session bound to the refresh cookie and clears the cookie. Idempotent.
      security:
        - StaffRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfProtectionHeader"
      responses:
        "204":
          description: Session revoked (or already revoked); cookie cleared
        "403":
          description: Missing `X-CSRF-Protection` header (`code=CSRF_HEADER_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/me:
    get:
      tags: [Auth]
      operationId: staffMe
      summary: Current staff profile and effective permissions
      x-implementation-status: implemented
      x-adr: ADR-003 D4, D7
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Current staff identity derived from the verified session (database role is authoritative)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMeResponse"
        "401":
          description: Invalid/expired token, revoked session, inactive or locked user (`code=SESSION_INVALID`), or role changed since issuance (`code=SESSION_STALE`, refresh to pick up the new role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/pin/forgot:
    post:
      tags: [Auth]
      operationId: staffForgotPin
      summary: Request a PIN-reset link by email
      x-implementation-status: implemented
      description: |
        Always answers 202, whether or not the store or email exists (no account enumeration). For an
        active, activated staff member a single-use link valid for 30 minutes is queued in the email outbox.
        Strict Nginx limit (10 req/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_slug, email]
              properties:
                store_slug:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "202":
          description: Accepted (an email may or may not have been sent)
        "400":
          description: Missing fields (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/pin/setup:
    post:
      tags: [Auth]
      operationId: staffSetupPin
      summary: Set a PIN from an activation or reset link
      x-implementation-status: implemented
      description: |
        `token` is the value after `#token=` in the emailed link (`<store_id>.<token_id>.<secret>`). The URL
        fragment is never sent to servers, so the secret stays out of access logs. Single use. On success
        all existing sessions of the user are revoked; after a reset a security notice email is queued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, pin]
              properties:
                token:
                  type: string
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "200":
          description: PIN set; the client can prefill the login form
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  store_slug:
                    type: string
                  email:
                    type: string
                    format: email
        "400":
          description: "`PIN_REJECTED` (format or weak PIN) or `LINK_INVALID` (unknown, used, or expired link)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/staff/pin/change:
    post:
      tags: [Auth]
      operationId: staffChangePin
      summary: Change own PIN (required after a temporary PIN)
      x-implementation-status: implemented
      description: A wrong `current_pin` counts toward the lockout. Other sessions are revoked; the current one stays signed in.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin:
                  type: string
                  writeOnly: true
                new_pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "204":
          description: PIN changed
        "400":
          description: "`PIN_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong current PIN (`INVALID_CREDENTIALS`) or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: List staff of the caller's store (owner)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffSummary"
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Staff]
      operationId: inviteStaff
      summary: Invite a staff member (owner)
      x-implementation-status: implemented
      description: Creates the account without a PIN and queues an activation email (link valid 48 hours). The store comes from the owner's token, never from the body.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role]
              properties:
                full_name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Stored trimmed and lower-case; unique per store regardless of case.
                role:
                  $ref: "#/components/schemas/StaffRole"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSummary"
        "400":
          description: Invalid name, email, or role (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already used in this store (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff/{id}/pin-reset:
    post:
      tags: [Staff]
      operationId: sendStaffPinReset
      summary: Email a PIN-reset link to a staff member (owner)
      x-implementation-status: implemented
      description: For a staff member who never activated, the invitation is re-sent instead.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Link queued
        "403":
          description: Not an owner (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown or inactive staff (`STAFF_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/staff/{id}/temporary-pin:
    post:
      tags: [Staff]
      operationId: issueStaffTemporaryPin
      summary: Set a temporary PIN for staff without email (owner)
      x-implementation-status: implemented
      description: The staff member must change it after login (`pin_change_required=true`). Not allowed on the owner's own account. Revokes all sessions of that staff member.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "204":
          description: Temporary PIN set
        "400":
          description: "`PIN_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner, or the owner's own account (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown staff (`STAFF_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerStaffJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Staff access token (HS256 JWT, 15-minute TTL per ADR-003 D4). Claims: `iss=mycaffe-backend`, `aud=mycaffe-pos`,
        `typ=staff_access`, `sub` (user id), `store_id`, `role` (`owner`, `cashier`, `barista`, `kitchen`), `sid` (session id),
        `jti`, `iat`, `exp`; header `kid`. Not stateless: every request is revalidated against the server-side session and
        current user role. Never sent in a query string.
    StaffRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-mc_staff_rt
      description: Opaque rotating refresh token (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth/staff). Planned, ADR-003 D4.
    TableQRToken:
      type: apiKey
      in: header
      name: X-Table-QR-Token
      description: Signed HMAC token binding a public dine-in/takeaway session to a specific `store_id` and `table_number`.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag from a previous response; the server answers 304 when unchanged.
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CsrfProtectionHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      description: Must be `1`. Forces a CORS preflight so cross-site forms cannot use the refresh cookie.
      schema:
        type: string
        enum: ["1"]

  responses:
    InvalidJSON:
      description: Malformed JSON body (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing permission (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found in the caller's store (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Uniqueness clash (`CONFLICT`) on `field`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictResponse"
    ValidationFailed:
      description: Field-level validation errors (`VALIDATION_FAILED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    GuestSession:
      type: object
      required: [table_number, expires_at]
      properties:
        table_number:
          type: string
        expires_at:
          type: string
          format: date-time
    GuestOrderRequest:
      type: object
      required: [idempotency_key, items]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 50
        customer_name:
          type: string
          maxLength: 60
          description: Defaults to "Tamu Meja <table number>"
        notes:
          type: string
          maxLength: 140
        expected_total:
          type: integer
          format: int64
        expected_quote_fingerprint:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OrderItemInput"
    GuestOrderResponse:
      type: object
      required: [order, is_idempotent_replay]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        tracking_token:
          type: string
          description: Shown once; only its SHA-256 is stored
        is_idempotent_replay:
          type: boolean
    GuestOrderSummary:
      type: object
      required: [id, order_number, queue_number, status, payment_status, total_amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        queue_number:
          type: string
        status:
          type: string
        payment_status:
          type: string
        total_amount:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TrackedOrder:
      type: object
      required: [store_name, order_number, queue_number, status, payment_status, updated_at]
      properties:
        store_name:
          type: string
        order_number:
          type: string
        queue_number:
          type: string
        status:
          type: string
        payment_status:
          type: string
        updated_at:
          type: string
          format: date-time
    TableInput:
      type: object
      properties:
        table_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Required on create; unique per store among non-archived tables (case-insensitive)
        label:
          type: string
          maxLength: 100
        section:
          type: string
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          default: 4
        is_active:
          type: boolean
    Table:
      type: object
      required: [id, table_number, label, section, capacity, qr_rotated_at, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        table_number:
          type: string
        label:
          type: string
        section:
          type: string
        capacity:
          type: integer
        qr_token:
          type: string
          description: Opaque 256-bit base64url token printed as QR (decision QR1); omitted for staff without table.qr.manage
        qr_rotated_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TableSession:
      type: object
      required: [id, table_id, status, opened_at, opened_via]
      properties:
        id:
          type: string
          format: uuid
        table_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        opened_at:
          type: string
          format: date-time
        opened_via:
          type: string
          enum: [qr, staff]
        opened_by_user_id:
          type: string
          format: uuid
        settled_at:
          type: string
          format: date-time
          description: All orders paid and served; starts the auto-close countdown
        closed_at:
          type: string
          format: date-time
        closed_by_user_id:
          type: string
          format: uuid
        close_reason:
          type: string
          enum: [cashier, auto]
    TableBoardEntry:
      allOf:
