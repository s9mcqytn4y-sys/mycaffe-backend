        permissions:
          type: array
          description: Effective permission constants from the backend RBAC policy (ADR-003 D7). UI hints only; the backend re-checks every request. Includes store-dependent grants such as `cashier_handles_bar`.
          items:
            type: string
          example: [order.pos.create, payment.tender.direct, shift.open]
        session_expires_at:
          type: string
          format: date-time

