openapi: 3.1.0
info:
  title: MyCaffe Core POS API
  version: 0.4.0
  summary: Multi-tenant QR Table Ordering, POS Cashier, Kitchen Display System (KDS), and Payment Reconciliation API
  description: |
    Official OpenAPI 3.1 contract for **MyCaffe Core POS** backend (`mycaffe-backend`).
    All monetary values are represented as whole integer Indonesian Rupiah (`int64`, e.g. `24000` = Rp 24.000) without floating-point numbers.
    Percentage rates (PB1 tax, service charge, QRIS MDR) are represented in Basis Points (`1% = 100 bps`).
  contact:
    name: MyCaffe Platform Engineering
servers:
  - url: http://localhost:8080
    description: Local Development API Server
  - url: https://api.example.com
    description: Production Single-VPS Hostinger KVM 2 Reverse Proxy (Nginx TLS)
tags:
  - name: Health
    description: Liveness and readiness probes for Docker Compose and Nginx
  - name: Catalog
    description: Public and staff menu catalog, modifier groups, and 1-level sub-addons
  - name: Orders
    description: Transactional order creation, stock reservation lifecycle, and real-time order tracking
  - name: Payments
    description: Payment initiation (QRIS, VA, E-Wallet, Cash, Static QRIS, EDC) and Midtrans webhook reconciliation
  - name: Auth
    description: "Staff authentication and session lifecycle (ADR-003). Implemented in Phase 02.01-B (login, refresh, logout, me)."
  - name: Staff
    description: Owner staff management - invitation, PIN reset link, temporary PIN (owner decision E2)
  - name: KDS
    description: Kitchen Display System and Barista preparation queue transitions
  - name: Tables
    description: Tables, derived table occupancy, table sessions and public QR resolution (iteration 5a)
  - name: Guest
    description: QR guest sessions, pay-first guest orders and the public order tracker (iteration 5b)

paths:
  /health:
    get:
      security: []
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusResponse"

  /health/ready:
    get:
      security: []
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe (verifies PostgreSQL 18 connection pool)
      responses:
        "200":
          description: Database connection pool is healthy and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusResponse"
        "503":
          description: Database connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/public/stores/{store_slug}/catalog:
    get:
      security: []
      tags: [Catalog]
      operationId: getPublicStoreCatalog
      summary: Guest menu of a store (categories, products, variants, modifier groups)
      x-implementation-status: implemented
      description: |
        Inactive categories and archived products are hidden; unavailable items stay listed with
        `available=false` and `sold_out_reason`. Stock counts are not exposed. Responses carry a content
        `ETag` (excluding `generated_at`) and `Cache-Control: public, max-age=30`; send `If-None-Match`
        to get `304`.
      parameters:
        - name: store_slug
          in: path
          required: true
          schema:
            type: string
            example: central-cafe
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Menu
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogView"
        "304":
          description: Not modified
        "404":
          description: Store not found or inactive (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/public/stores/{store_slug}/orders/quote:
    parameters:
      - name: store_slug
        in: path
        required: true
        schema:
          type: string
        description: URL slug identifier of the cafe store
    post:
      tags: [Orders]
      operationId: getPublicOrderQuote
      summary: Lock-free calculation of subtotal, discounts, PB1 tax, and service charge for guest order
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteOrderRequest"
      responses:
        "200":
          description: Calculated quote summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order quote total changed compared to client expected total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteChangedErrorResponse"

  /api/v1/pos/catalog:
    get:
      tags: [Catalog]
      operationId: getStaffCatalog
      summary: POS menu for signed-in staff (includes inactive categories and stock counts)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogView"
        "304":
          description: Not modified

  /api/v1/catalog/categories:
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Create a category (owner, catalog.manage)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateCategory
      summary: Update a category (partial)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: deleteCategory
      summary: Delete a category (its products remain, uncategorized)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products:
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a product with its variants (owner)
      x-implementation-status: implemented
      description: At least one variant; exactly one default when there are several (a single variant becomes the default). `base_price` follows the default variant. SKUs are normalized to upper case.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product with variants
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update product fields (partial; variants have their own endpoints)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: archiveProduct
      summary: Archive a product and its variants (order history keeps its snapshots)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: setProductAvailability
      summary: Mark a product available or sold out
      x-implementation-status: implemented
      description: Bar items need `item.availability.toggle.beverage` (barista, owner, cashier with `cashier_handles_bar`); kitchen items need `item.availability.toggle.food`.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        "204":
          description: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: createVariant
      summary: Add a variant to a product (owner)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "201":
          description: Created
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/variants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Catalog]
      operationId: updateVariant
      summary: Update a variant (partial); price changes are audited (PRICE_CHANGE)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Catalog]
      operationId: archiveVariant
      summary: Archive a non-default variant
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-groups:
    get:
      tags: [Catalog]
      operationId: listModifierGroups
      summary: List all active modifier groups for the tenant
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: List of modifier groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  modifier_groups:
                    type: array
                    items:
                      type: object
                      description: Modifier group with its options (see ModifierGroupInput for writable fields).
    post:
      tags: [Catalog]
      operationId: createModifierGroup
      summary: Create a new modifier group
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/catalog/modifier-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Catalog]
      operationId: getModifierGroup
      summary: Get modifier group details with options and child groups
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Modifier group details
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Catalog]
      operationId: updateModifierGroup
      summary: Update a modifier group (partial)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalog]
      operationId: archiveModifierGroup
      summary: Archive a modifier group (soft delete and optional force unlink)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Force archive by unlinking from products and parent options
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-groups/{id}/options:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: createModifierOption
      summary: Add an option to a modifier group (supports negative delta P1)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierOptionInput"
      responses:
        "201":
          description: Option created
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/modifier-groups/{id}/options/{option_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: option_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      operationId: updateModifierOption
      summary: Update a modifier option (partial; price changes are audited)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierOptionInput"
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalog]
      operationId: archiveModifierOption
      summary: Archive a modifier option
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/products/{id}/modifier-groups:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: attachModifierGroupToProduct
      summary: Link a modifier group to a product
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachModifierGroupInput"
      responses:
        "204":
          description: Linked
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/products/{id}/modifier-groups/{group_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Catalog]
      operationId: detachModifierGroupFromProduct
      summary: Unlink a modifier group from a product
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Unlinked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/modifier-options/{id}/child-groups:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Catalog]
      operationId: attachChildGroupToOption
      summary: Attach a modifier group as a child sub-addon to an option (max depth 1, cycle protected)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachChildGroupInput"
      responses:
        "204":
          description: Attached
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/catalog/modifier-options/{id}/child-groups/{group_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Catalog]
      operationId: detachChildGroupFromOption
      summary: Detach a child modifier group from an option
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "204":
          description: Detached
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pos/orders:
    post:
      tags: [Orders]
      operationId: createPosOrder
      summary: Create a POS order (cashier/owner)
      x-implementation-status: implemented
      description: |
        Permission `order.pos.create`. The store and the acting user come only from the access token;
        any `store_id` or `actor_user_id` in the body is ignored. Prices, taxes, service charge, stock and
        modifiers are recomputed server-side. Replaying the same `idempotency_key` with the same payload
        returns the original order (200); a different payload returns 409.
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
        "200":
          description: Idempotent replay of an existing order
        "400":
          description: Invalid order or modifier selection (`INVALID_ORDER`, `INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing `order.pos.create` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Unavailable item, insufficient stock, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/pos/orders/quote:
    post:
      tags: [Orders]
      operationId: getPosOrderQuote
      summary: Lock-free calculation of subtotal, discounts, PB1 tax, and service charge for POS order
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteOrderRequest"
      responses:
        "200":
          description: Calculated quote summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteOrderResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          description: Missing `order.pos.create` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order quote total changed compared to client expected total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteChangedErrorResponse"

  /api/v1/pos/orders/{order_id}/payments:
    post:
      tags: [Payments]
      operationId: initiatePosPayment
      summary: Take or initiate a payment for an order split (cashier/owner)
      x-implementation-status: implemented
      description: |
        Direct tender (`cash`, `static_qris`, `edc`) needs `payment.tender.direct` and settles in one audited
        transaction recorded against the signed-in user. Gateway methods (`qris`, `gopay`, `shopeepay`,
        `bank_transfer`) need `payment.initiate.gateway` and run a two-phase Midtrans Core API charge.
        Replaces the removed `POST /api/v1/orders/{order_id}/payments/initiate`.
      security:
        - BearerStaffJWT: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentRequest"
      responses:
        "200":
          description: Payment attempt recorded (gateway charge details or settled cashier tender)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiatePaymentResponse"
        "400":
          description: Invalid method, method not enabled, insufficient cash, or missing reconciliation_ref (`INVALID_PAYMENT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role may not take this payment method (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found in the caller's store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Split already paid, order not payable, or idempotency conflict (`PAYMENT_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/pos/tables:
    get:
      tags: [Tables]
      operationId: listTables
      summary: Table board with derived occupancy (any staff; QR token only with table.qr.manage)
      description: Lazily closes settled sessions past `table_idle_close_minutes` before reading (decision QR7).
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      responses:
        "200":
          description: Non-archived tables of the caller's store
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/TableBoardEntry"
    post:
      tags: [Tables]
      operationId: createTable
      summary: Create a table with a fresh opaque QR token (owner, table.manage)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: Created table (includes qr_token for printing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/pos/tables/{id}:
    patch:
      tags: [Tables]
      operationId: updateTable
      summary: Update number, label, section, capacity or is_active (owner, table.manage)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/pos/tables/{id}/archive:
    post:
      tags: [Tables]
      operationId: archiveTable
      summary: Retire a table; its QR stops resolving (owner, table.manage)
      x-implementation-status: implemented
      security:
        - BearerStaffJWT: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Archived
        "403":
